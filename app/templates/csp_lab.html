<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>{{ lab.id }} target</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body class="target-body">
<div class="target-banner">{{ lab.id }} target &middot; CSP lab</div>
<p class="csp-hint">Check the <code>Content-Security-Policy</code> response header in DevTools &rarr; Network.</p>

<form method="get" class="target-form">
  <label>x <input type="text" name="x" value="{{ request.args.get('x','') }}"></label>
  <button type="submit">reflect</button>
</form>

{% if probe %}
<div class="target-render">{{ probe|safe }}</div>
{% endif %}

<div class="target-render">
{{ page_html|safe }}
</div>
</body>
</html>
