id: S04
title: Naive keyword filter at submit time
category: stored
difficulty: advanced
engine: stored
public:
  objective: Store a value that executes JavaScript when the record is viewed.
  description: Submit the `comment` field below, then reload to see it rendered back.
  instructions: Find an input that causes JavaScript to execute in the target, then come back and mark
    the lab solved.
engine_config:
  fields:
  - comment
  context: html_text
  transform_in: []
  transform_out: []
  filter:
    type: keyword
    blocked:
    - <script
private:
  why: stored value is rendered without output encoding at view time
walkthrough:
  hints:
  - Only the literal substring `<script` is blocked, applied once, at submit time.
  - You don't need a `<script>` tag to execute JavaScript in an `html_text` context -- plenty of other
    tags have event handlers.
  solution: 'The filter blocks `<script` (case-insensitive, single pass) but nothing else. Submit a payload
    that doesn''t contain that substring at all:


    `comment=<img src=x onerror=alert(1)>`


    and reload. No `<script` substring ever appears, so the filter never triggers, and the stored value
    renders unencoded. Fix: encode output regardless of filtering, and don''t rely on tag-name denylists.'
