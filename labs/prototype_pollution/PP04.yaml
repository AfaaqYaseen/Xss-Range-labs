id: PP04
title: Multi-gadget chain
category: prototype_pollution
difficulty: expert
engine: pp
public:
  objective: Pollute Object.prototype via the merge below, then get a gadget to read the polluted value
    into a sink.
  description: The merge implementation here uses 'deep' semantics.
  instructions: Find an input that causes JavaScript to execute in the target, then come back and mark
    the lab solved.
client:
  mode: deep
  gadgets:
  - type: innerHTML
    path: template
  - type: attr_href
    path: redirect
  defaults:
    template: <b>default</b>
    redirect: https://example.com
private:
  why: deep merge copies attacker keys without guarding __proto__/constructor/prototype
walkthrough:
  hints:
  - 'Two gadgets are wired up this time: `innerHTML` reading `template`, and `attr_href` reading `redirect`.
    One `__proto__` payload can pollute both keys at once.'
  - Deep merge, so nest both keys under a single `__proto__` object in your JSON.
  solution: 'Submit a single payload polluting both gadget paths at once:


    `{"__proto__":{"template":"<img src=x onerror=alert(1)>","redirect":"javascript:alert(2)"}}`


    Both `Object.prototype.template` and `Object.prototype.redirect` get set by the same unguarded `deepMerge`
    call. The `innerHTML` gadget fires immediately on render; click the rendered "gadget link" to trigger
    the `href` gadget too. This demonstrates how a single prototype-pollution primitive can cascade into
    multiple independent sinks if more than one gadget in the app happens to read from `Object.prototype`.'
