id: R01
title: Basic HTML reflection
category: reflected
difficulty: beginner
engine: reflected
public:
  objective: Make the target execute JavaScript via a GET parameter.
  description: The page reflects the `q` parameter back into the page.
  instructions: Find an input that causes JavaScript to execute in the target, then come back and mark
    the lab solved.
engine_config:
  params:
  - q
  context: html_text
  transform: []
  filter:
    type: none
private:
  why: user input reaches an HTML/JS context without output encoding, and any filter present is a single
    non-recursive pass
walkthrough:
  hints:
  - The `q` parameter comes back somewhere in the page. Look at the response, not just what renders visually.
  - There's no filter and no output encoding on this one -- whatever you send in `q` lands in the HTML
    as-is.
  solution: '`q` is reflected straight into an `html_text` context (`<div class=''reflect''>{q}</div>`)
    with no filter and no output encoding. Visit:


    `/lab/R01/run?q=<img src=x onerror=alert(1)>`


    The `<img>` tag is inserted as real markup, the browser tries to load `x`, fails, and fires `onerror`.
    The fix is to HTML-encode `q` before inserting it into the page.'
